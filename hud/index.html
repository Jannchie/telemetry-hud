<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telemetry HUD</title>
<!-- 字体全部本地打包（OFL 授权），不依赖网络：Michroma、Chakra Petch、JetBrains Mono；由 tools/fetch-fonts.mjs 生成 -->
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0e0f11; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* 控制面板：叠在后处理画布之上，不受畸变影响 */
  #hud-panel, #hud-gear { font-family: "Chakra Petch", "Microsoft YaHei UI", "PingFang SC", sans-serif; color: var(--hud-fg); }
  #hud-panel {
    position: fixed; top: 16px; right: 16px; z-index: 20; width: 288px; max-height: calc(100vh - 32px); overflow: auto;
    padding: 14px 16px 12px; background: var(--hud-bg); border: 1px solid var(--hud-line); font-size: 12px;
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
    /* 不用 backdrop-filter：盖在 WebGL 画布上做背景模糊，会让 Wallpaper Engine 的离屏渲染 CEF 崩溃 */
  }
  #hud-panel[hidden] { display: none; }
  #hud-panel header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; letter-spacing: .3em; font-weight: 600; font-size: 11px; }
  #hud-panel section { padding: 10px 0 4px; border-top: 1px solid var(--hud-line); }
  #hud-panel h3 { margin: 0 0 8px; font-size: 10px; font-weight: 600; letter-spacing: .25em; color: var(--hud-dim); }
  #hud-panel button { font: inherit; color: inherit; background: none; border: 1px solid var(--hud-line); cursor: pointer; }
  #hud-panel button:focus-visible, #hud-panel input:focus-visible, #hud-gear:focus-visible { outline: 1px solid var(--hud-hot); outline-offset: 2px; }
  #hud-panel .x { border: none; font-size: 16px; line-height: 1; padding: 2px 6px; color: var(--hud-dim); }
  #hud-panel .x:hover { color: var(--hud-fg); }
  #hud-panel .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #hud-panel .themes button { display: flex; align-items: center; gap: 3px; padding: 6px 8px; text-align: left; text-transform: uppercase; letter-spacing: .1em; font-size: 10px; }
  #hud-panel .themes button span { margin-left: 6px; }
  #hud-panel .themes i { width: 4px; height: 12px; transform: skewX(-20deg); }
  #hud-panel .themes button[aria-pressed="true"] { border-color: var(--hud-hot); }
  #hud-panel .themes button:hover { border-color: var(--hud-dim); }
  #hud-panel label { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; margin: 0 0 10px; }
  #hud-panel label.sl input { grid-column: 1 / -1; }
  #hud-panel output { font-variant-numeric: tabular-nums; color: var(--hud-dim); font-size: 11px; }
  #hud-panel input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; margin: 0; background: transparent; cursor: pointer; }
  #hud-panel input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(to right, var(--hud-hot) var(--p, 0%), var(--hud-line) var(--p, 0%)); }
  #hud-panel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 7px; height: 14px; margin-top: -6px; background: var(--hud-hot); transform: skewX(-20deg); }
  #hud-panel input[type=range]:disabled { opacity: .35; cursor: default; }
  #hud-panel input[type=checkbox] {
    -webkit-appearance: none; appearance: none; width: 30px; height: 12px; margin: 0; border: 1px solid var(--hud-line); position: relative; cursor: pointer;
  }
  #hud-panel input[type=checkbox]::after { content: ""; position: absolute; top: 1px; left: 1px; width: 12px; height: 8px; background: var(--hud-dim); transition: transform .15s; }
  #hud-panel input[type=checkbox]:checked { border-color: var(--hud-hot); }
  #hud-panel input[type=checkbox]:checked::after { transform: translateX(15px); background: var(--hud-hot); }
  #hud-panel input[type=checkbox]:disabled { opacity: .35; }
  /* 帧率用分段按钮而不是 <select>：原生下拉框会让 Wallpaper Engine 的离屏渲染 CEF 崩溃 */
  #hud-panel .fps { display: grid; gap: 4px; margin: 0 0 10px; }
  #hud-panel .seg { display: flex; gap: 4px; }
  #hud-panel .seg button { flex: 1; padding: 3px 0; font-size: 11px; font-variant-numeric: tabular-nums; }
  #hud-panel .seg button[aria-pressed="true"] { border-color: var(--hud-hot); color: var(--hud-hot); }
  #hud-panel .seg button:hover { border-color: var(--hud-dim); }
  #hud-panel footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--hud-line); color: var(--hud-dim); font-size: 10px; }
  #hud-panel footer button { padding: 4px 10px; font-size: 11px; }
  #hud-panel footer button:hover { border-color: var(--hud-hot); }
  #hud-gear {
    position: fixed; top: 10px; right: 10px; z-index: 19; width: 28px; height: 28px; display: grid; place-items: center;
    background: none; border: 1px solid transparent; opacity: .12; cursor: pointer; transition: opacity .2s, border-color .2s;
  }
  #hud-gear:hover, #hud-gear:focus-visible, #hud-gear[aria-expanded="true"] { opacity: 1; border-color: var(--hud-line); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * 数据源优先级：LINK（本地 helper）> LIVELY（Lively 内置硬件信息）> SIM（模拟数据）
 *
 * LINK 端点默认 http://127.0.0.1:27182/stats ，可用 ?endpoint= 覆盖。需要返回 CORS 头。JSON 结构：
 * {
 *   "host": "DESKTOP-01",
 *   "uptime": 12345,                                   // 秒
 *   "cpu":  { "usage": 37.2, "cores": [12, 80, ...], "coreTypes": ["P", "P", ..., "E"], "freq": 4.21, "temp": 52, "name": "..." },
 *           // usage/cores 为 0-100，freq 为 GHz；coreTypes 与 cores 一一对应（逻辑处理器的大核 P / 小核 E），可省略
 *   "gpu":  { "usage": 18.5, "vramUsed": 6.1, "vramTotal": 16, "temp": 48, "power": 120, "clock": 2.4, "name": "..." },
 *           // vram 单位 GB，power 为 W，clock 为 GHz
 *   规格（都可省略，缺哪项就不显示哪项）：
 *   "cpu.spec": { "pCores": 6, "eCores": 8, "threads": 20, "baseClock": 3.5, "boostClock": 5.1, "cacheMB": 24, "tdp": 125 }
 *   "gpu.spec": { "memType": "GDDR6X", "busWidth": 256, "boostClock": 2.61, "tdp": 285, "driver": "566.36" }
 *   "mem":  { "used": 14.2, "total": 32, "available": 17.8, "cached": 9.1, "committed": 20.3, "commitLimit": 41.5, "compressed": 0.4,
 *             "slots": 4, "modules": [ { "slot": "DIMM_A2", "capacity": 16, "type": "DDR5", "speed": 6000, "configuredSpeed": 6000,
 *             "voltage": 1.35, "manufacturer": "...", "partNumber": "...", "serial": "...", "status": "OK" } ] },  // GB；slots 为主板插槽总数
 *   "disks":[ { "name": "C:", "type": "NVMe", "used": 412, "total": 1000, "read": 0, "write": 0 } ],  // GB，read/write 为 B/s，type 为 NVMe / SSD / HDD
 *   "net":  { "up": 0, "down": 0 }                     // B/s
 *   disks[].busy: 0-100 磁盘忙碌率（100 − % Idle Time）
 *   disks[].health: { "lifeUsed": 3, "spare": 100, "powerOnHours": 12345, "tbw": 42.1 }   // 拿不到时省略
 *   "power": { "ac": true, "battery": null | { "percent": 87, "charging": true, "remainingMin": 143 },
 *              "plan": "Balanced", "mode": "best-efficiency" | "balanced" | "best-performance" | null,
 *              "cpuW": 65.2 | null, "systemW": 120.5 | null }   // 只接受真实测量值，拿不到为 null
 *   "board": { "vendor": "...", "product": "...", "bios": "...",
 *              "slots": [ { "name": "PCIEX16_1", "kind": "PCIe", "width": 16, "gen": 5, "inUse": true, "device": "...", "link": "x16 Gen4" } ],
 *              "devices": [ { "name": "...", "class": "storage", "bus": "PCIe", "where": "M.2 · PEG60", "link": "x4 Gen4", "disk": "C:" } ] }
 * }
 *
 * 构图：一套左右镜像的贝塞尔引导线，全部从中央透镜的两个尖端或中轴生长出来。
 *   A 上翼：CPU / GPU 负载带 → 节点（冠线接入）→ 核心梳齿 / 显存块 → 外延射线 + 日志
 *   B 下翼：磁盘卷 / 温度    → 节点（龙骨接入）→ 读 / 写带       → 外延射线 + 流动粒子
 *   C 地平线：系统日志
 *   中轴向上分出冠线，向下分出龙骨（网络波形），透镜上缘为内存
 * 每个组件都是某条线被打断后的一段，或被线围出的区域里的读数。
 */
// 配色：hot = 负载 / 射线主色，cool = 流量 / 次要数据，mark = 标记点与显存，alt = 内存压力告警，heat = 高温告警
const THEMES = {
  ember: {
    bg: '#0c0c0e', bg0: '#16151a', bg1: '#08080a', fg: '#ece6da', dim: '#7c766b', line: '#4a453f', faint: '#2a2723',
    hot: '#ff6b2c', cool: '#8fd3d6', mark: '#d7f04a', alt: '#c77dff', heat: '#ff2d6f',
  },
  glacier: {
    bg: '#0a0f17', bg0: '#121c2a', bg1: '#070b12', fg: '#e3edf7', dim: '#62748c', line: '#33465c', faint: '#1b2636',
    hot: '#ff4f70', cool: '#5ee3ff', mark: '#b9a3ff', alt: '#ffb84d', heat: '#ff3d3d',
  },
  phosphor: {
    bg: '#070b08', bg0: '#0f1712', bg1: '#050806', fg: '#d6f5da', dim: '#5d7d63', line: '#2e4634', faint: '#18251b',
    hot: '#ff9a3c', cool: '#47f5a0', mark: '#f3ef9a', alt: '#ff5577', heat: '#ff2e63',
  },
  classic: {
    bg: '#0e0f11', bg0: '#141619', bg1: '#0a0b0d', fg: '#dfe3e6', dim: '#6b7076', line: '#43484e', faint: '#2a2d31',
    hot: '#e5243b', cool: '#2bb5a4', mark: '#f4c21b', alt: '#b48cff', heat: '#ff3fa4',
  },
};
const alpha = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};
let C, themeName;
function setTheme(name) {
  themeName = THEMES[name] ? name : 'ember';
  C = { ...THEMES[themeName] };
  C.coolDeep = alpha(C.cool, .16);
  document.body.style.background = C.bg;
  if (window.hudReady) resize();
}
const F = {
  disp: '"Michroma", "Chakra Petch", sans-serif',
  ui: '"Chakra Petch", "Segoe UI", sans-serif',
  mono: '"JetBrains Mono", "Cascadia Mono", Consolas, monospace',
};
const TAU = Math.PI * 2;
const params = new URLSearchParams(location.search);
const ENDPOINT = params.get('endpoint') || 'http://127.0.0.1:27182/stats';
let fpsCap = +(params.get('fps') || 0);
// 底部预留空间（设计像素），?bottom= 可调
const BOTTOM = +(params.get('bottom') ?? 80);
setTheme(params.get('theme'));

// ---------- data ----------
// 实际运行绝不显示模拟数据：没有数据源时所有字段为空，各组件显示 NO SIGNAL。
// 模拟数据只在 ?demo=1 时启用，用于生成预览图。
// ?demo=1：随机模拟数据；?demo=tour：脚本化的功能巡演（循环播放各种负载、告警、掉线与主题）
const TOUR = params.get('demo') === 'tour';
const DEMO = TOUR || params.get('demo') === '1';
const emptyData = () => ({
  host: null, up: null,
  cpu: { u: null, cores: [], types: [], f: null, t: null, name: null, spec: null },
  gpu: { u: null, vu: null, vt: null, t: null, power: null, clock: null, name: null, spec: null },
  mem: { u: null, t: null, avail: null, cache: null, commit: null, cl: null, comp: null, mods: [], slots: 0 },
  disks: [], net: { up: null, dn: null }, board: null, power: null,
});
const DEMO_DATA = {
  host: 'LOCALHOST', up: 0,
  cpu: { u: .2, cores: new Array(20).fill(.2), types: [...'PPPPPPPPPPPP', ...'EEEEEEEE'], f: 4.2, t: 50, name: 'Simulated CPU', spec: { pCores: 6, eCores: 8, threads: 20, baseClock: 3.5, boostClock: 5.1, cacheMB: 24, tdp: 125 } },
  gpu: { u: .1, vu: 4, vt: 16, t: 45, power: 0, clock: 0, name: 'Simulated GPU', spec: { memType: 'GDDR6X', busWidth: 256, boostClock: 2.61, tdp: 285, driver: '566.36' } },
  mem: {
    u: 12, t: 32, slots: 4,
    mods: [
      { slot: 'DIMM_A2', capacity: 16, type: 'DDR5', speed: 6000, configuredSpeed: 6000, voltage: 1.35, manufacturer: 'Simulated', partNumber: 'SIM-D5-16G', serial: '00000001', status: 'OK' },
      { slot: 'DIMM_B2', capacity: 16, type: 'DDR5', speed: 6000, configuredSpeed: 6000, voltage: 1.35, manufacturer: 'Simulated', partNumber: 'SIM-D5-16G', serial: '00000002', status: 'OK' },
    ],
  },
  disks: [
    { n: 'C:', ty: 'NVMe', u: 412, t: 1000, r: 0, w: 0, h: { lifeUsed: 4, spare: 100, powerOnHours: 5210, tbw: 18.4 } },
    { n: 'D:', ty: 'SSD', u: 1310, t: 2000, r: 0, w: 0, h: { lifeUsed: 37, powerOnHours: 21400, tbw: 96.2 } },
    { n: 'E:', ty: 'HDD', u: 2620, t: 4000, r: 0, w: 0, h: { powerOnHours: 30120 } },
  ],
  net: { up: 0, dn: 0 },
  power: { ac: true, battery: null, plan: 'High performance', mode: 'balanced', cpuW: 64, systemW: null },
  board: {
    vendor: 'Simulated', product: 'Board Z000', bios: '0001',
    slots: [
      { name: 'PCIEX16_1', kind: 'PCIe', width: 16, gen: 5, inUse: true, device: 'Simulated GPU', link: 'x16 Gen4' },
      { name: 'M.2_1', kind: 'M.2', width: 4, gen: 4, inUse: true, device: 'Simulated NVMe', link: 'x4 Gen4' },
      { name: 'PCIEX1_1', kind: 'PCIe', width: 1, gen: 3, inUse: false },
      { name: 'PCIEX16_2', kind: 'PCIe', width: 4, gen: 4, inUse: false },
      { name: 'M.2_2', kind: 'M.2', width: 4, gen: 4, inUse: false },
    ],
    devices: [
      { name: 'Simulated NVMe', class: 'storage', bus: 'PCIe', where: 'M.2_1', link: 'x4 Gen4', disk: 'C:' },
      { name: 'Simulated 2.5GbE', class: 'network', bus: 'PCIe', where: 'Onboard', link: 'x1 Gen2' },
      { name: 'Simulated HD Audio', class: 'audio', bus: 'HDA', where: 'Onboard', link: null },
      { name: 'Simulated SATA SSD', class: 'storage', bus: 'SATA', where: 'SATA 1', link: null, disk: 'D:' },
    ],
  },
};
const D = DEMO ? DEMO_DATA : emptyData();
let src = DEMO ? 'SIM' : 'NONE', linkFails = 99, livelyAt = -1e9;
// 断开数据源时：演示模式回到模拟数据，正常模式清空为 NO SIGNAL
const dropSource = () => { src = DEMO ? 'SIM' : 'NONE'; if (!DEMO) Object.assign(D, emptyData()); };

// 每次整体覆盖：数据源没提供的字段一律为 null，绝不沿用旧值或模拟值
const num = (v) => typeof v === 'number' && isFinite(v) ? v : null;
function ingest(j) {
  const c = j.cpu || {}, g = j.gpu || {}, m = j.mem || {}, n = j.net || {};
  D.host = j.host || null; D.up = num(j.uptime);
  D.cpu = {
    u: num(c.usage) == null ? null : c.usage / 100,
    cores: Array.isArray(c.cores) ? c.cores.map(v => v / 100) : [],
    types: Array.isArray(c.coreTypes) ? c.coreTypes : [],
    f: num(c.freq), t: num(c.temp), name: c.name || null, spec: c.spec || null,
  };
  D.gpu = {
    u: num(g.usage) == null ? null : g.usage / 100, vu: num(g.vramUsed), vt: num(g.vramTotal), t: num(g.temp),
    power: num(g.power), clock: num(g.clock), name: g.name || null, spec: g.spec || null,
  };
  D.mem = {
    u: num(m.used), t: num(m.total), avail: num(m.available), cache: num(m.cached), commit: num(m.committed),
    cl: num(m.commitLimit), comp: num(m.compressed), mods: Array.isArray(m.modules) ? m.modules : [], slots: num(m.slots) || 0,
  };
  D.disks = Array.isArray(j.disks)
    ? j.disks.map(d => ({ n: d.name, ty: d.type || '', u: num(d.used), t: num(d.total), r: num(d.read), w: num(d.write), busy: num(d.busy), h: d.health || null }))
    : [];
  D.net = { up: num(n.up), dn: num(n.down) };
  D.board = j.board || null;
  D.power = j.power || null;
}

async function poll() {
  try {
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), 800);
    const r = await fetch(ENDPOINT, { signal: ctl.signal, cache: 'no-store' });
    clearTimeout(tm);
    if (!r.ok) throw new Error(r.status);
    ingest(await r.json());
    linkFails = 0; src = 'LINK';
  } catch { linkFails++; }
  // 连不上时退避到 5s 一次，避免刷屏
  setTimeout(poll, linkFails > 5 ? 5000 : 1000);
}
// 演示模式不连接数据服务，避免真实数据覆盖演示脚本
if (!DEMO) poll();

// Lively Wallpaper：LivelyInfo.json 中 Arguments 加 --system-information 后会回调这里
window.livelySystemInformation = (json) => {
  if (src === 'LINK') return;
  const o = JSON.parse(json);
  livelyAt = performance.now(); src = 'LIVELY';
  // Lively 只提供下面这些字段，其余保持为空（显示 NO SIGNAL）
  Object.assign(D, emptyData());
  D.cpu.u = o.CurrentCpu / 100;
  D.cpu.name = o.NameCpu || null;
  D.cpu.spec = { threads: navigator.hardwareConcurrency };
  D.gpu.u = o.CurrentGpu3D / 100;
  D.gpu.name = o.NameGpu || null;
  D.mem.t = o.TotalRam / 1024; D.mem.u = (o.TotalRam - o.CurrentRamAvail) / 1024; D.mem.avail = o.CurrentRamAvail / 1024;
  D.net.up = o.CurrentNetUp; D.net.dn = o.CurrentNetDown;
};

// Wallpaper Engine：跟随其帧率设置
window.wallpaperPropertyListener = {
  applyGeneralProperties(p) { if (p.fps != null) fpsCap = p.fps; },
  // 在 WE 编辑器里添加一个名为 theme 的组合框属性，值为 ember / glacier / phosphor / classic
  // WE 用户属性：theme（组合框）、glow / scan / curve / parallax / sfx（滑块）、hum / fx（复选框），与控制面板共用一套设置
  applyUserProperties(p) {
    const patch = {};
    if (p.theme) patch.theme = p.theme.value;
    for (const k of ['glow', 'scan', 'curve', 'parallax', 'sfx']) if (p[k]) patch[k] = +p[k].value;
    if (p.hum) patch.hum = !!p.hum.value;
    if (p.fx) patch.fx = !!p.fx.value;
    applySettings(patch);
  },
};

const simState = { cpuB: 0, gpuB: 0, netB: 0, ioB: 0, t0: performance.now() };
function simulate() {
  const t = performance.now() / 1000, r = Math.random;
  const decay = (v) => v * .85;
  simState.cpuB = r() < .05 ? .3 + r() * .4 : decay(simState.cpuB);
  simState.gpuB = r() < .03 ? .4 + r() * .5 : decay(simState.gpuB);
  simState.netB = r() < .06 ? 2e7 + r() * 8e7 : decay(simState.netB);
  simState.ioB = r() < .05 ? 5e7 + r() * 4e8 : decay(simState.ioB);
  const cl = (v) => Math.min(1, Math.max(0, v));
  D.cpu.u = cl(.22 + .14 * Math.sin(t / 13) + .08 * Math.sin(t / 3.7) + (r() - .5) * .06 + simState.cpuB);
  // 模拟 6P(12T) + 8E：前台负载主要落在大核上
  D.cpu.cores = D.cpu.cores.map((_, i) => cl(D.cpu.u * (D.cpu.types[i] === 'E' ? .6 : 1.25) + Math.sin(i * 1.7 + t / 2) * .12 + (r() - .5) * .16));
  D.cpu.f = 3.6 + 1.6 * D.cpu.u; D.cpu.t = 40 + 45 * D.cpu.u;
  D.gpu.u = cl(.12 + .1 * Math.sin(t / 19) + (r() - .5) * .04 + simState.gpuB);
  D.gpu.vu = 3.2 + 9 * D.gpu.u; D.gpu.t = 36 + 44 * D.gpu.u;
  D.gpu.power = 18 + 267 * D.gpu.u; D.gpu.clock = .21 + 2.4 * Math.min(1, D.gpu.u * 3);
  D.mem.u = 13 + 3 * Math.sin(t / 40) + 6 * simState.cpuB;
  D.mem.avail = D.mem.t - D.mem.u; D.mem.cache = Math.min(D.mem.avail, 9 + 2 * Math.sin(t / 50));
  D.mem.commit = D.mem.u * 1.3 + 2; D.mem.cl = D.mem.t + 9.5; D.mem.comp = .3 + .2 * Math.sin(t / 30);
  D.net.dn = Math.max(0, 4e5 + 3e5 * Math.sin(t / 5) + simState.netB * (.6 + r() * .4));
  D.net.up = Math.max(0, 6e4 + 4e4 * Math.sin(t / 7) + simState.netB * .08 * r());
  D.disks.forEach((d, i) => { const share = i === 0 ? 1 : .25 / i; d.r = simState.ioB * share * r(); d.w = (2e6 + simState.ioB * .3) * share * r(); });
  D.up = (performance.now() - simState.t0) / 1000 + 86400 * 2 + 3600 * 5;

// ---------- geometry ----------
const lerp = (a, b, t) => a + (b - a) * t;

// 由三次贝塞尔段组成的路径，按弧长参数化（u ∈ [0,1]），法线统一朝“外侧”
class Path {
  constructor(segs, n = 48) {
    const p = [];
    segs.forEach(([a, b, c, d], k) => {
      for (let i = k ? 1 : 0; i <= n; i++) {
        const t = i / n, m = 1 - t;
        p.push({
          x: m * m * m * a.x + 3 * m * m * t * b.x + 3 * m * t * t * c.x + t * t * t * d.x,
          y: m * m * m * a.y + 3 * m * m * t * b.y + 3 * m * t * t * c.y + t * t * t * d.y,
        });
      }
    });
    const cum = [0];
    for (let i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y));
    this.p = p; this.cum = cum; this.len = cum[cum.length - 1]; this.o = 1;
    this.n = p.map((_, i) => {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(p.length - 1, i + 1)];
      const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1;
      return { x: -dy / l, y: dx / l };
    });
  }
  outer(ref) {
    this.o = 1;
    const q = this.at(.5);
    if (q.nx * (q.x - ref.x) + q.ny * (q.y - ref.y) < 0) this.o = -1;
    return this;
  }
  idx(L) {
    let lo = 0, hi = this.cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; this.cum[m] <= L ? lo = m : hi = m; }
    return lo;
  }
  at(u) {
    u = Math.min(1, Math.max(0, u));
    const L = u * this.len, i = this.idx(L), j = Math.min(i + 1, this.p.length - 1);
    const f = (L - this.cum[i]) / ((this.cum[j] - this.cum[i]) || 1);
    const a = this.p[i], b = this.p[j], na = this.n[i], nb = this.n[j];
    let nx = lerp(na.x, nb.x, f), ny = lerp(na.y, nb.y, f);
    const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    return { x: lerp(a.x, b.x, f), y: lerp(a.y, b.y, f), nx: nx * this.o, ny: ny * this.o, a: Math.atan2(-nx, ny), u };
  }
  samples(ua, ub) {
    const out = [this.at(ua)], L0 = ua * this.len, L1 = ub * this.len;
    for (let i = this.idx(L0) + 1; i < this.p.length && this.cum[i] < L1; i++)
      out.push({ x: this.p[i].x, y: this.p[i].y, nx: this.n[i].x * this.o, ny: this.n[i].y * this.o, u: this.cum[i] / this.len });
    out.push(this.at(ub));
    return out;
  }
  trace(ua, ub, off = 0) {
    this.samples(ua, ub).forEach((q, i) => {
      const x = q.x + q.nx * off, y = q.y + q.ny * off;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
  }
}

// 折线 → 贝塞尔段：直线为主，拐角处用过渡弧。r 为过渡长度，可传数组逐个拐角指定；
// 统一半径时每个拐角最多占相邻线段的一半，逐个指定时放宽到 3/4（由调用方保证同一线段两端加起来不超长）
function poly(pts, r = 14) {
  const L = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) });
  const line = (a, b) => [a, L(a, b, 1 / 3), L(a, b, 2 / 3), b];
  const segs = [];
  let cur = pts[0];
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], p = pts[i], b = pts[i + 1];
    const la = Math.hypot(p.x - a.x, p.y - a.y), lb = Math.hypot(b.x - p.x, b.y - p.y);
    const ri = Array.isArray(r) ? r[i - 1] : r, cap = Array.isArray(r) ? .75 : .5;
    const p1 = L(p, a, Math.min(ri, la * cap) / la), p2 = L(p, b, Math.min(ri, lb * cap) / lb);
    segs.push(line(cur, p1), [p1, L(p1, p, .55), L(p2, p, .55), p2]);
    cur = p2;
  }
  segs.push(line(cur, pts[pts.length - 1]));
  return segs;
}

// 每条翼线上的分段位置（弧长比例）
// s0..s1 必须完全落在斜向直线段内（避开两端拐角的过渡弧），否则格子会跟着弧线歪掉
const U = { s0: .095, s1: .315, join: .43, m0: .47, m1: .69, o0: .73 };
// 下翼的分盘读写放在最外侧的水平直线段上
const UB = { io0: .6, io1: .965 };
const G = {};
function build() {
  const M = (p) => ({ x: 1920 - p.x, y: p.y });
  const MS = (segs) => segs.map(sg => sg.map(M));
  const P = (x, y) => ({ x, y });
  const tip = P(820, 540);
  // 翼线固定画到 x=60，超宽屏多出的部分由 extend() 用直线补齐，保证分段比例不随屏幕变化
  const A = poly([P(800, 540), P(770, 540), P(590, 330), P(420, 300), P(60, 300)], 18);
  const B = poly([P(800, 540), P(770, 540), P(600, 730), P(440, 770), P(60, 770)], 18);
  const Hz = poly([P(780, 540), P(650, 540), P(634, 556), P(60, 556)], 6);
  // 上缘斜边角度与下方支腿一致（dx:dy = 30:46），支腿就是这条斜边越过尖端后的延长
  // 两端从左右翼的水平短线以过渡弧拐入斜边；斜边本身越过尖端继续向下就是支腿，形成“道岔”
  const lensT = poly([P(786, 540), tip, P(850, 494), P(1070, 494), M(tip), P(1134, 540)], [17, 36, 36, 17]);

  // A 的外侧 = 上方（朝向中轴围出的区域），B 的外侧 = 下方
  G.A = [new Path(A).outer({ x: 300, y: 900 }), new Path(MS(A)).outer({ x: 1620, y: 900 })];
  G.B = [new Path(B).outer({ x: 300, y: 200 }), new Path(MS(B)).outer({ x: 1620, y: 200 })];
  G.H = [new Path(Hz).outer({ x: 400, y: 2000 }), new Path(MS(Hz)).outer({ x: 1520, y: 2000 })];
  G.lensT = new Path(lensT).outer({ x: 960, y: 540 });

  // 冠线：从中轴分出，落在 A 的节点上
  // 水平走一段后以 45° 斜切落下
  G.crown = G.A.map((Pa, k) => {
    const q = Pa.at(U.join), sx = k ? -1 : 1;
    return new Path(poly([P(960, 280), P(q.x + sx * (q.y - 280), 280), P(q.x, q.y)], 34));
  });
  // 龙骨：从 B 的左节点 45° 下沉，水平穿过中轴底端，再升到 B 的右节点
  const kl = G.B[0].at(U.join), kr = G.B[1].at(U.join), ky = 800;
  // 装饰括号：在翼线斜段外侧，上下两段与 A / B 斜段平行，中段竖直，地平线从中段穿过
  const brk = [P(600, 380), P(676, 470), P(676, 610), P(582, 715)];
  G.brk = [new Path(poly(brk, 36)), new Path(poly(brk.map(M), 36))];
  G.split = G.B[0].at(UB.io0); G.lanes = null;
  G.keel = new Path(poly([P(kl.x, kl.y), P(kl.x + (ky - kl.y), ky), P(kr.x - (ky - kr.y), ky), P(kr.x, kr.y)], 36))
    .outer({ x: 960, y: 540 });
}

// ---------- draw helpers ----------
function seg(x1, y1, x2, y2, c, w) {
  ctx.strokeStyle = c; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function dot(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ring(x, y, r, c, w = 1.5) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); }
function txt(str, x, y, font, color, align = 'left', alpha = 1, ls = 0) {
  if (SCR > 0) str = scramble(String(str));
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.globalAlpha = alpha;
  if (ls) ctx.letterSpacing = ls + 'px';

// 无信号时的闪烁：大部分时间稳定，偶尔短暂变暗
const flicker = (t) => (Math.sin(t * 23) > .93 || Math.sin(t * 7.3) > .97) ? .25 : .9;
// 信号丢失文字：红青错位叠印，偶尔整体横跳一下
function glitchText(str, x, y, font, align = 'left') {
  const now = performance.now() / 1000, jump = (now * 1.7) % 1 < .05 ? Math.sin(now * 90) * 5 : 0;
  txt(str, x + jump - 1.5, y, font, C.hot, align, .45);
  txt(str, x + jump + 1.5, y, font, C.cool, align, .45);
  txt(str, x + jump, y, font, C.fg, align, flicker(now));
}
// 无信号格子条：警示色空格 + 一格亮块来回扫描（像在搜索信号）
function noSigBar(P, a, b, h, off, seed = 0, n = 0) {
  const cnt = n || Math.max(3, Math.floor((b - a) * P.len / 9)), now = performance.now() / 1000;
  cellBar(P, a, b, h, 0, C.hot, off, cnt, Math.round((Math.sin(now * 2.2 + seed) * .5 + .5) * (cnt - 1)));
}
function noSigLabel(P, u, off, str, seed = 0) {
  pathLabel(P, u, off, str, `600 9px ${F.ui}`, C.hot, flicker(performance.now() / 1000 + seed), 2);
}
function stroke(P, ua, ub, color, w, off = 0) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); P.trace(ua, ub, off); ctx.stroke();
}
// 在路径某点按切线方向放置内容，自动翻转保证文字朝上；fn 收到外侧法线在局部坐标中的 y 方向
function onPath(P, u, off, fn) {
  const q = P.at(u);
  let a = q.a;
  if (Math.cos(a) < 0) a += Math.PI;
  const ly = -Math.sin(a) * q.nx + Math.cos(a) * q.ny;
  ctx.save(); ctx.translate(q.x + q.nx * off, q.y + q.ny * off); ctx.rotate(a); fn(ly < 0 ? -1 : 1); ctx.restore();
}
// 沿路径的分段格子条：贴在线的一侧（off>0 外侧，off<0 内侧），格子为斜切平行四边形，按格量化填充
// h 可以是数字，或 [起点高度, 终点高度] 表示由细到粗；斜切角度固定，所以不同高度的格子短边仍然互相平行
// hi：额外高亮的格子序号（无信号时做来回扫描的亮块），-1 表示不高亮
function cellBar(P, ua, ub, h, frac, color, off = 4, n = 0, hi = -1) {
  const len = (ub - ua) * P.len;
  n = n || Math.max(3, Math.floor(len / 9));
  const [h0, h1] = Array.isArray(h) ? h : [h, h];
  const hAt = (i) => lerp(h0, h1, n > 1 ? i / (n - 1) : 1);
  const step = (ub - ua) / n, fill = Math.round(Math.min(1, Math.max(0, frac)) * n);
  const sd = off < 0 ? -1 : 1, o0 = off, slant = .45 / P.len;
  const quad = (i) => {
    const a = ua + step * i, b = a + step * .68, hi = hAt(i), o1 = o0 + sd * hi, skew = hi * slant;
    const p0 = P.at(a), p1 = P.at(b), p2 = P.at(b + skew), p3 = P.at(a + skew);
    ctx.moveTo(p0.x + p0.nx * o0, p0.y + p0.ny * o0);
    ctx.lineTo(p1.x + p1.nx * o0, p1.y + p1.ny * o0);
    ctx.lineTo(p2.x + p2.nx * o1, p2.y + p2.ny * o1);
    ctx.lineTo(p3.x + p3.nx * o1, p3.y + p3.ny * o1);
    ctx.closePath();
  };
  ctx.fillStyle = color;
  ctx.globalAlpha = .16; ctx.beginPath(); for (let i = fill; i < n; i++) quad(i); ctx.fill();
  ctx.globalAlpha = 1; ctx.beginPath(); for (let i = 0; i < fill; i++) quad(i); ctx.fill();
  if (hi >= 0 && hi < n) { ctx.globalAlpha = .8; ctx.beginPath(); quad(hi); ctx.fill(); ctx.globalAlpha = 1; }
  // 两端的定位刻度：与格子同样的斜切角度，保证所有短边互相平行
  const shift = (o) => (o - o0) * sd * slant;
  ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.globalAlpha = .6; ctx.beginPath();
  for (const [u, he] of [[ua - step * .32, h0], [ub, h1]]) {
    const t0 = -sd * 3, t1 = o0 + sd * (he + 3);
    const qa = P.at(u + shift(t0)), qb = P.at(u + shift(t1));
    ctx.moveTo(qa.x + qa.nx * t0, qa.y + qa.ny * t0); ctx.lineTo(qb.x + qb.nx * t1, qb.y + qb.ny * t1);
  }
  ctx.stroke(); ctx.globalAlpha = 1;
  stroke(P, ua, ub, C.line, 1);
}

// 机械计数器式滚动数字：最低位随小数连续滚动，进位时高位一起滚
function odo(x, y, val, intD, decD, size, color, align, ghost) {
  ctx.font = `${size}px ${F.mono}`; ctx.textAlign = 'left'; ctx.fillStyle = color;
  const cw = ctx.measureText('0').width, dw = decD ? cw * .55 : 0, n = intD + decD, w = n * cw + dw;
  let cx = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  const v = Math.max(0, val) * 10 ** decD;
  let iv = Math.floor(v), carry = v - iv;
  const dig = [], roll = [];
  for (let p = 0; p < n; p++) { const d = iv % 10; dig[p] = d; roll[p] = carry; carry = d === 9 ? carry : 0; iv = Math.floor(iv / 10); }
  const sig = String(Math.floor(Math.max(0, val))).length;
  const lh = size * 1.08;
  const al = (off, base) => base * Math.max(0, 1 - Math.abs(off) / lh * .82);
  // 所有位只露出当前行，进位滚动不会叠成一串；最低位另在行外画淡残影
  const band = lh * .55;
  let lowX = cx, lowD = 0, lowR = 0;
  ctx.save(); ctx.beginPath(); ctx.rect(cx - 2, y - band, w + 4, band * 2); ctx.clip();
  for (let c = 0; c < n; c++) {
    if (c === intD) {
      ctx.globalAlpha = 1;
      ctx.fillText('.', cx + (dw - ctx.measureText('.').width) / 2, y);
      cx += dw;
    }
    const p = n - 1 - c, d = dig[p], r = roll[p];
    const base = p - decD >= sig ? .16 : 1;
    ctx.globalAlpha = al(-r * lh, base); ctx.fillText(d, cx, y - r * lh);
    if (r > .001) { ctx.globalAlpha = al((1 - r) * lh, base); ctx.fillText((d + 1) % 10, cx, y + (1 - r) * lh); }
    if (p === 0) { lowX = cx; lowD = d; lowR = r; }
    cx += cw;
  }
  ctx.restore();
  if (ghost) {
    ctx.save(); ctx.beginPath();
    ctx.rect(lowX - 2, y - band - lh * 1.6, cw + 4, lh * 1.6); ctx.rect(lowX - 2, y + band, cw + 4, lh * 1.6);
    ctx.clip();
    for (let j = -1; j <= 2; j++) {
      const off = (j - lowR) * lh;
      ctx.globalAlpha = .22 * Math.max(0, 1 - Math.abs(off) / (lh * 1.9));
      ctx.fillText((lowD + j + 10) % 10, lowX, y + off);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  return w;
}

// [tag] 首段 · 其余  —— 首段白色，其余青色，可带打字进度
function tagWidth(tag, msg) {
  ctx.font = `11px ${F.mono}`; const a = ctx.measureText(tag).width;
  ctx.font = `12px ${F.ui}`; return a + 18 + ctx.measureText(msg).width;
}
function tagLine(tag, msg, x, y, alpha, shown = Infinity) {
  ctx.globalAlpha = alpha; ctx.textAlign = 'left';
  ctx.font = `11px ${F.mono}`;
  const tw = ctx.measureText(tag).width;
  ctx.strokeStyle = C.line; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y - 7.5, tw + 10, 15);
  ctx.fillStyle = C.dim; ctx.fillText(tag, x + 5, y + .5);
  const vis = msg.slice(0, shown);
  const cut = msg.indexOf(' · ');
  const head = cut < 0 ? vis : vis.slice(0, cut), tail = cut < 0 ? '' : vis.slice(cut);
  ctx.font = `12px ${F.ui}`;
  let mx = x + tw + 18;
  ctx.fillStyle = C.fg; ctx.fillText(head, mx, y); mx += ctx.measureText(head).width;
  if (tail) { ctx.fillStyle = C.cool; ctx.fillText(tail, mx, y); mx += ctx.measureText(tail).width; }
  if (shown < msg.length) { ctx.fillStyle = C.cool; ctx.fillRect(mx + 2, y - 5, 6, 10); }
  ctx.globalAlpha = 1;
}
// slant：每往外一层横向错开的距离，堆叠后整体呈平行四边形
function drawLog(log, y0, dir, now, slant = 0) {
  const fade = [1, .5, .26];
  log.lines.forEach((L, i) => {
    depth(i * Z1, () => tagLine(L.tag, L.msg, i * slant, y0 * dir + dir * i * 17, fade[i], Math.floor((now - L.t) * 80)));
  });
}
function pathLabel(P, u, off, str, font, color, alpha = 1, ls = 0) {
  onPath(P, u, off, () => txt(str, 0, 0, font, color, 'center', alpha, ls));
}

// ---------- components ----------
// 翼线上的节点：线在此断开，留一个小环
function node(P, u, r = 4) { const q = P.at(u); ring(q.x, q.y, r, C.fg, 1.25); }
function endDot(P) {
  // 超宽屏：从 x=60 处用直线延伸到屏幕边缘
  const q = P.at(1), ex = q.x < 960 ? Math.min(q.x, EL + 60) : Math.max(q.x, ER - 60);
  if (ex !== q.x) seg(q.x, q.y, ex, q.y, C.hot, 2.5);
  dot(ex, q.y, 4.5, C.fg);
}
// 信号脉冲：一小段亮线沿骨架从中心向外跑，跑完后停顿一会儿再出发
function pulse(P, t, speed, phase, ua = 0, ub = 1, rev = false) {
  const span = (ub - ua) * P.len, cyc = span / speed * 1.6;
  const f = ((t + phase * cyc) % cyc) / cyc * 1.6;
  if (f > 1) return;
  const len = 46 / P.len;
  let a = ua + (ub - ua) * f;
  if (rev) a = ub - (a - ua);
  const b = rev ? Math.min(ub, a + len) : Math.max(ua, a - len);
  ctx.globalAlpha = Math.sin(Math.PI * f) * .85;
  stroke(P, Math.min(a, b), Math.max(a, b), C.fg, 1.5);
  ctx.globalAlpha = 1;
}
function particles(P, ua, ub, phase, n, color) {
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const f = (i / n + phase) % 1, q = P.at(ua + (ub - ua) * f);
    ctx.globalAlpha = Math.sin(Math.PI * f) * .9;
    ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;
}

function wingA(k, now) {
  const P = G.A[k], load = k ? S.gpu : S.cpu;
  stroke(P, 0, U.s0 - .01, C.line, 1.5);
  if (load == null) { noSigBar(P, U.s0, U.s1, [4, 18], 4, k); noSigLabel(P, (U.s0 + U.s1) / 2, -14, `${k ? 'GPU' : 'CPU'} · NO SIGNAL`, k); }
  else cellBar(P, U.s0, U.s1, [4, 18], load, C.hot, 4);
  stroke(P, U.s1 + .008, U.join - .012, C.line, 1.5);
  node(P, U.join);
  stroke(P, U.join + .012, U.m0 - .008, C.line, 1.5);
  if (k === 0 && !D.cpu.cores.length) {
    noSigBar(P, U.m0, U.m1, 8, 5, 2);
    noSigLabel(P, (U.m0 + U.m1) / 2, -14, 'CORES · NO SIGNAL', 2);
  } else if (k === 0) {
    // CPU 核心：沿线外侧的梳齿，大核 / 小核分成两组，中间断开
    const n = Math.min(D.cpu.cores.length, 64), types = D.cpu.types;
    const pIdx = [], eIdx = [];
    for (let i = 0; i < n; i++) (types[i] === 'E' ? eIdx : pIdx).push(i);
    const groups = eIdx.length && pIdx.length
      ? [[pIdx, 'P-CORE', C.cool, 1, 30], [eIdx, 'E-CORE', C.fg, .6, 20]]
      : [[pIdx.length ? pIdx : eIdx, 'THREADS', C.cool, 1, 30]];
    const gap = .018, avail = U.m1 - U.m0 - gap * (groups.length - 1);
    ctx.lineWidth = Math.max(1.2, Math.min(3, avail * P.len / n * .5));
    let u0 = U.m0;
    for (const [idx, name, col, al, amp] of groups) {
      const span = avail * idx.length / n;
      stroke(P, u0, u0 + span, C.faint, 1);
      idx.forEach((ci, j) => {
        const v = S.cores[ci], q = P.at(u0 + span * (j + .5) / idx.length), len = 3 + v * amp;
        ctx.strokeStyle = v > .85 ? C.hot : col; ctx.globalAlpha = v > .85 ? 1 : al;
        ctx.beginPath(); ctx.moveTo(q.x + q.nx * 5, q.y + q.ny * 5); ctx.lineTo(q.x + q.nx * (5 + len), q.y + q.ny * (5 + len)); ctx.stroke();
      });
      ctx.globalAlpha = 1;
      pathLabel(P, u0 + span / 2, -14, `${name} ×${idx.length}`, `600 9px ${F.ui}`, C.dim, 1, 2);
      u0 += span + gap;
    }
  } else {
    // 显存：每格 1 GB
    if (S.vu == null || !D.gpu.vt) {
      noSigBar(P, U.m0, U.m1, 8, 5, 3);
      noSigLabel(P, (U.m0 + U.m1) / 2, -14, 'VRAM · NO SIGNAL', 3);
    } else {
      cellBar(P, U.m0, U.m1, 8, S.vu / D.gpu.vt, C.mark, 5, Math.max(4, Math.min(32, Math.round(D.gpu.vt))));
      pathLabel(P, (U.m0 + U.m1) / 2, -14, `VRAM ${S.vu.toFixed(1)} / ${D.gpu.vt.toFixed(0)} GB`, `600 9px ${F.ui}`, C.dim, 1, 2);
    }
  }
  stroke(P, U.m1 + .008, U.o0 - .006, C.line, 1.5);
  stroke(P, U.o0, 1, C.hot, 2.5);
  particles(P, U.o0, 1, S.flow[k], 7, C.fg);
  endDot(P);
  onPath(P, uAtX(P, k ? 1530 : 100), 26, (dir) => drawLog(k ? logs.gpu : logs.cpu, 0, dir, now, k ? -12 : 12));

  // 冠线：有电池时兼作电量条
  const Cr = G.crown[k];
  stroke(Cr, CR0, CR1, C.line, 1.25);
  crownBattery(Cr, now);
}

// 电池：左右两条冠线从外端（翼线节点）向中心同步填充，长度 = 电量；充电时粒子流向中心，用电池供电时填充头部呼吸，
// 电量低于 20% 且未充电时闪烁。没有电池（台式机）时什么都不画
const CR0 = .02, CR1 = .955;
const batColor = (pct) => pct > 50 ? C.cool : pct > 20 ? C.mark : C.hot;
function crownBattery(P, now) {
  const bat = D.power && D.power.battery;
  if (!bat || bat.percent == null) return;
  const ua = CR1 - (CR1 - CR0) * clamp01(bat.percent / 100), col = batColor(bat.percent);
  ctx.globalAlpha = bat.percent <= 20 && !bat.charging ? flicker(now) : 1;
  stroke(P, ua, CR1, col, 2.5);
  ctx.globalAlpha = 1;
  if (bat.charging) particles(P, ua, CR1, 1 - (now * .3) % 1, 5, C.fg);
  else {
    const q = P.at(ua);
    dot(q.x, q.y, 2.5, col);
    ctx.globalAlpha = .25 + .25 * Math.sin(now * 2.2); ring(q.x, q.y, 5.5, col, 1); ctx.globalAlpha = 1;
  }
}

function wingB(k) {
  const P = G.B[k];
  stroke(P, 0, U.s0 - .01, C.line, 1.5);
  if (k === 0) {
    // 总容量：斜段上一条格子条，左下格子的 STORAGE 引线指向这里
    const [used, total] = diskTotals();
    if (total == null) {
      noSigBar(P, U.s0, U.s1, 7, -4, 4);
      noSigLabel(P, (U.s0 + U.s1) / 2, 14, 'VOLUMES · NO SIGNAL', 4);
    } else {
      cellBar(P, U.s0, U.s1, 7, used / total, C.fg, -4);
      const nH = D.disks.filter(d => d.ty === 'HDD').length, nS = D.disks.length - nH;
      pathLabel(P, (U.s0 + U.s1) / 2, 14, nH ? `${nS} SSD · ${nH} HDD` : `${D.disks.length} VOLUMES`, `600 9px ${F.ui}`, C.dim, 1, 2);
    }
  } else {
    // 温度：CPU / GPU 两节，颜色随温度变化
    const items = [['CPU', S.ct], ['GPU', S.gt]], span = (U.s1 - U.s0) / 2, bothLost = S.ct == null && S.gt == null;
    if (bothLost) noSigLabel(P, (U.s0 + U.s1) / 2, 14, 'TEMPS · NO SIGNAL', 1.3);
    items.forEach(([n, t], i) => {
      const a = U.s0 + span * i + .008, b = U.s0 + span * (i + 1) - .008;
      if (t == null) {
        noSigBar(P, a, b, 6, -4, i * 1.3);
        if (!bothLost) noSigLabel(P, (a + b) / 2, 14, `${n} · NO SIG`, i * 3.1);
      } else {
        cellBar(P, a, b, 6, (t - 25) / 75, t >= 85 ? C.hot : t >= 70 ? C.mark : C.cool, -4);
        pathLabel(P, (a + b) / 2, 14, `${n} ${t.toFixed(0)}°C`, `11px ${F.mono}`, C.dim);
      }
    });
  }
  stroke(P, U.s1 + .008, U.join - .012, C.line, 1.5);
  node(P, U.join);
  // 节点之后是一段传输线，粒子流速跟随总读 / 写吞吐
  stroke(P, U.join + .012, UB.io0, C.hot, 2.5);
  particles(P, U.join + .012, UB.io0, S.flow[2 + k], 5, C.cool);
  if (k === 0) { diskLanes(); return; }
  // 右翼：总读 / 写两条格子条
  const mid = (UB.io0 + UB.io1) / 2;
  stroke(P, UB.io0, 1, C.hot, 2.5);
  [[UB.io0 + .012, mid - .008, S.dr, 'READ'], [mid + .008, UB.io1, S.dw, 'WRITE']].forEach(([a, b, v, name], i) => {
    if (v == null) { noSigBar(P, a, b, 8, -4, 5 + i); noSigLabel(P, (a + b) / 2, 14, `${name} · NO SIGNAL`, 5 + i); return; }
    cellBar(P, a, b, 8, Math.log10(1 + v / 1e5) / 4, C.cool, -4);
    pathLabel(P, (a + b) / 2, 14, `${name} ${rate(v)}`, `10px ${F.mono}`, C.dim);
  });
  endDot(P);
  slotLanes();
}

// 主板插槽支路：与左下的磁盘支路镜像。从右下翼分流点竖直引出主干，每个插槽一条水平支路，往下每条向左错开 skew。
// 插着设备：实线 + 粒子；中间格子数 = 槽位通道数，亮起格数 = 实际协商的通道数。空槽：虚线 + EMPTY。
const SLOT = { x1: 1836, gap: 30, skew: 12, top: 822 };
function slotLanes() {
  const b = D.board;
  // 设备树：先列固件插槽表里的插槽（含插在上面的设备），再列不在插槽表里的板载 / M.2 / SATA / 音频设备
  const slotList = b && Array.isArray(b.slots) ? b.slots : [];
  const slotNames = new Set(slotList.map(sl => sl.name));
  const CLASS_ORDER = ['display', 'storage', 'network', 'wireless', 'audio', 'other'];
  const devs = (b && Array.isArray(b.devices) ? b.devices : []).filter(d => !slotNames.has(d.where));
  const asEntry = (d) => ({
    name: d.where || d.bus || '', kind: [d.bus, d.class && d.class.toUpperCase()].filter(Boolean).join(' · '),
    width: +((d.link || '').match(/x(\d+)/i) || [])[1] || 0, inUse: true,
    device: d.disk ? `${d.name} · ${d.disk}` : d.name, link: d.link,
  });
  const extra = devs.filter(d => d.bus !== 'USB')
    .sort((x, y) => CLASS_ORDER.indexOf(x.class) - CLASS_ORDER.indexOf(y.class)).map(asEntry);
  // USB 设备合并成一条
  const usbDevs = devs.filter(d => d.bus === 'USB');
  const usb = usbDevs.length ? [{
    name: 'USB', kind: 'USB · ' + [...new Set(usbDevs.map(d => (d.class || 'other').toUpperCase()))].join(' / '),
    width: 0, inUse: true, device: usbDevs.map(d => d.name).join(' / '), link: null,
  }] : [];
  // 插在插槽上的存储设备补上盘符
  const disksAt = Object.fromEntries((b && b.devices || []).filter(d => slotNames.has(d.where) && d.disk).map(d => [d.where, d.disk]));
  const isUsed = (sl) => sl.inUse ?? !!sl.device;
  const usedSlots = slotList.filter(isUsed).map(sl => disksAt[sl.name] && sl.device ? { ...sl, device: `${sl.device} · ${disksAt[sl.name]}` } : sl);
  // 空槽按“类型 + 通道数”合并成一条
  const groups = {};
  for (const sl of slotList.filter(sl => !isUsed(sl))) (groups[`${sl.kind}|${sl.width}`] ||= []).push(sl);
  const emptyEntries = Object.values(groups).map(g => ({
    name: g.map(x => x.name).join(' '), kind: g[0].kind, width: g[0].width, gen: g[0].gen,
    inUse: false, device: g.length > 1 ? `${g.length} × EMPTY` : 'EMPTY',
  }));
  const entries = [...usedSlots, ...extra, ...usb, ...emptyEntries];
  if (!entries.length) {
    const x0 = 1920 - G.split.x, y0 = G.split.y;
    ctx.setLineDash([4, 4]); seg(x0, y0, x0, SLOT.top, C.line, 1); seg(x0, SLOT.top, SLOT.x1, SLOT.top, C.line, 1); ctx.setLineDash([]);
    dot(x0, y0, 2.5, C.dim);
    glitchText('MAINBOARD · NO SIGNAL', SLOT.x1, SLOT.top - 10, `600 10px ${F.ui}`, 'right');
    if (b && (b.vendor || b.product)) txt(cleanName([b.vendor, b.product].filter(Boolean).join(' ')).toUpperCase(), SLOT.x1, SLOT.top + 14, `9px ${F.mono}`, C.dim, 'right');
    return;
  }
  const ss = entries.slice(0, 8), n = ss.length, x0 = 1920 - G.split.x, y0 = G.split.y;
  const yN = SLOT.top + (n - 1) * SLOT.gap;
  seg(x0, y0, x0 - (n - 1) * SLOT.skew, yN, C.line, 1.5);
  dot(x0, y0, 2.5, C.fg);
  const now = performance.now() / 1000;
  ss.forEach((sl, i) => {
    const y = SLOT.top + i * SLOT.gap, xa = x0 - i * SLOT.skew, xb = SLOT.x1 - i * SLOT.skew;
    const used = sl.inUse ?? !!sl.device;
    const width = sl.width || 0, linkW = +((sl.link || '').match(/x(\d+)/i) || [])[1] || (used ? width : 0);
    ctx.globalAlpha = used ? .75 : 1;
    if (!used) ctx.setLineDash([4, 4]);
    seg(xa, y, xb, y, used ? C.hot : C.line, used ? 1.5 : 1);
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    dot(xa, y, 2, used ? C.fg : C.line);
    if (used) {
      // 粒子：沿支路向外流动
      ctx.fillStyle = C.cool;
      for (let j = 0; j < 4; j++) {
        const f = (j / 4 + now * .12 + i * .17) % 1;
        ctx.globalAlpha = Math.sin(Math.PI * f) * .9;
        ctx.fillRect(xa + (xb - xa) * f - 1.5, y - 1.5, 3, 3);
      }
      ctx.globalAlpha = 1;
    }
    // 通道格子
    if (width) {
      // 通道格子放在设备名（左，限宽 120）与位置名（右，限宽 90）之间的空档
      const L = new Path(poly([{ x: xa + 136, y }, { x: xb - 100, y }])).outer({ x: 1700, y: 3000 });
      cellBar(L, 0, 1, 5, width ? linkW / width : 0, used ? C.cool : C.dim, 3, width);
    }
    // 文字：上方设备名 / 槽位名，下方规格 / 链路
    ctx.font = `10px ${F.ui}`;
    txt(fit(used ? (sl.device || 'DEVICE') : (sl.device || 'EMPTY'), 120), xa + 8, y - 8, `10px ${F.ui}`, used ? C.fg : C.dim, 'left', used ? .9 : .6);
    ctx.font = `600 9px ${F.ui}`;
    txt(fit(String(sl.name || '').replace(/^Onboard · /i, '').toUpperCase(), 90), xb, y - 8, `600 9px ${F.ui}`, C.dim, 'right', 1, 1.5);
    const spec = [sl.kind, width ? `x${width}` : '', sl.gen ? `Gen${sl.gen}` : ''].filter(Boolean).join(' ');
    txt(spec, xa + 8, y + 9, `9px ${F.mono}`, C.dim);
    if (used && sl.link) txt(sl.link, xb, y + 9, `9px ${F.mono}`, C.cool, 'right');
  });
  // 主板型号与 BIOS
  const name = [b.vendor, b.product].filter(Boolean).join(' ');
  if (name) {
    const y = yN + 30, xr = SLOT.x1 - (n - 1) * SLOT.skew;
    txt(cleanName(name).toUpperCase().slice(0, 40), xr, y, `600 11px ${F.ui}`, C.fg, 'right', .9, 1);
    if (b.bios) txt(`BIOS ${b.bios}`, xr, y + 15, `9px ${F.mono}`, C.dim, 'right');
  }
}


// 并联磁盘支路：左下翼在分流点分出若干条平行水平支路，每往下一条向右错开 skew，每条一块盘，外端汇到汇流排后继续延伸到端点
const LANE = { x1: 84, gap: 46, skew: 18 };
function diskLanes() {
  const ds = D.disks.slice(0, 5), n = ds.length;
  if (!n) {
    const x0 = G.split.x, y0 = G.split.y, ex = Math.min(60, EL + 60);
    ctx.setLineDash([4, 4]); seg(x0, y0, LANE.x1, y0, C.line, 1); ctx.setLineDash([]);
    seg(LANE.x1, y0, ex, y0, C.hot, 2.5); dot(ex, y0, 4.5, C.fg);
    glitchText('STORAGE · NO SIGNAL', LANE.x1 + 12, y0 - 12, `600 10px ${F.ui}`);
    return;
  }
  const x0 = G.split.x, y0 = G.split.y, yN = y0 + (n - 1) * LANE.gap;
  if (!G.lanes || G.lanes.length !== n)
    G.lanes = ds.map((_, i) => new Path(poly([{ x: x0 + i * LANE.skew, y: y0 + i * LANE.gap }, { x: LANE.x1 + i * LANE.skew, y: y0 + i * LANE.gap }])).outer({ x: 240, y: 3000 }));

// 时间轨：左侧地平线是“今天”，右侧是“今年”，都从屏幕外缘（起点）流向中心（终点）。

const WEEK = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

    ticks = Array.from({ length: 25 }, (_, i) => [i / 24, i % 6 === 0 && i < 24 ? pad2(i) : null, i % 6 === 0]);
    main = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;

    main = `${y}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())} ${WEEK[d.getDay()]}`;

  const tx = at(1).x, al = k ? 'left' : 'right', ly = baseY + 26;

  // 进度细线：和时间轴同向，从外侧往中心填充
  const bw = 140, by = baseY + 66, x0 = k ? tx + bw : tx - bw, x1 = x0 + (k ? -bw : bw) * f;
  depth(Z1, () => {
    txt(sub, tx, baseY + 58, `9px ${F.mono}`, C.cool, al);

// 读数步进：每 STEP.every 秒取一次目标并取整，用固定时长的非线性动画滚过去，其余时间停在整数上

  const triad = [
    [886, 'CPU', stepped('cpu', D.cpu.u == null ? null : D.cpu.u * 100, now), D.cpu.f == null ? null : `${D.cpu.f.toFixed(2)} GHz`],
    [960, 'MEM', stepped('mem', memPct, now), memPct == null ? null : `${D.mem.u.toFixed(1)} / ${D.mem.t.toFixed(0)} GB`],
    [1034, 'GPU', stepped('gpu', D.gpu.u == null ? null : D.gpu.u * 100, now), D.gpu.t == null ? null : `${D.gpu.t.toFixed(0)}°C`],

    else odo(x, 535, v, 3, 0, 24, al ? acol : v >= 85 ? C.hot : C.fg, 'center', false);
    depth(Z2, () => {

  ring(960, 800, 4, C.fg, 1.25);

  // 准星环：虚线旋转

  ctx.setLineDash([3, 7]); ring(0, 0, 14, alpha(C.dim, .6), 1); ctx.setLineDash([]);
  ctx.restore();
}

function keel() {

// ---------- post fx：辉光 / CRT 扫描线 / 曲面畸变 ----------
// 2D 画布照常绘制，每帧作为纹理交给 WebGL2 做一次全屏后处理；不支持 WebGL2 或 ?fx=0 时直接显示 2D 画布。
// 强度参数：?glow= ?scan= ?curve=（0 关闭，1 为默认强度的上限附近），WE 用户属性同名。
function fxNum(k, d) { const v = params.get(k); return v == null ? d : +v; }
const FX = { glow: fxNum('glow', 0), scan: fxNum('scan', .4), curve: fxNum('curve', .5) };
function createFx() {
  const c = document.createElement('canvas');
  const gl = c.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false });
  if (!gl) return null;
  const vs = `#version 300 es
in vec2 p; out vec2 v_uv;
void main() { v_uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
  const fs = `#version 300 es
precision highp float;
uniform sampler2D u_tex;
uniform float u_t, u_glow, u_scan, u_curve, u_dpr, u_asp;
uniform vec2 u_tilt, u_par;
in vec2 v_uv; out vec4 o;
// 视差转角：画面是绕中心旋转的平面（先绕 x 轴转 u_tilt.y，再绕 y 轴转 u_tilt.x），相机在 z = -D 处透视观察；
// 求屏幕像素对应的视线与平面的交点，换回平面内坐标。转角为 0 时是恒等映射
vec2 tilt(vec2 c) {
  if (u_tilt == vec2(0.)) return c;
  const float D = 2.2;
  float sa = sin(u_tilt.x), ca = cos(u_tilt.x), sb = sin(u_tilt.y), cb = cos(u_tilt.y);
  vec3 ex = vec3(ca, 0., -sa), ey = vec3(sb * sa, cb, sb * ca), n = vec3(cb * sa, -sb, cb * ca);
  vec3 o = vec3(0., 0., -D), d = vec3(c.x * u_asp, c.y, D);

}
// 骨架的深度场：画面是中心凸起的穹面，中心（透镜与读数）最近 z = 1，屏幕左右边缘最远 z = -1。
// 视差时按 z 错开采样位置，近处逆着鼠标、远处顺着鼠标移动；深度连续变化，线条不会断开
vec2 field(vec2 c) {
  if (u_par == vec2(0.)) return c;
  float d = min(length(vec2(c.x * u_asp, c.y)) / u_asp, 1.);
  return c + u_par * cos(3.14159265 * d);
}
void main() {
  // 曲面畸变：中心内容缩小、向边缘逐渐拉伸；四边中点贴边，四角轻微裁切，不留黑边
  vec2 c = tilt(field(v_uv * 2. - 1.));
  float k = .1 * u_curve, r2 = dot(c, c);
  vec2 cd = c * (1. + k * (1. - r2));
  vec2 uv = vec2(cd.x * .5 + .5, .5 - cd.y * .5);
  // 径向色差，越靠边越明显
  vec2 ca = cd * .0016 * u_curve * r2;
  vec3 col = vec3(texture(u_tex, uv + ca).r, texture(u_tex, uv).g, texture(u_tex, uv - ca).b);
  // 辉光：三档 mipmap 模糊叠加，减去一点阈值避免把背景整体抬亮
  vec3 bloom = textureLod(u_tex, uv, 2.).rgb * .55 + textureLod(u_tex, uv, 4.).rgb * .35 + textureLod(u_tex, uv, 6.).rgb * .3;
  col += max(bloom - .045, 0.) * u_glow * 1.6;
  // 扫描线：每 3 个 CSS 像素一条；外加一条缓慢下行的亮带
  float s = .5 + .5 * cos(gl_FragCoord.y * 6.2832 / (3. * u_dpr));
  col *= 1. - u_scan * .5 * (1. - s);
  float band = exp(-pow((fract(u_t * .06) - (1. - v_uv.y)) * 10., 2.));
  col += (col * .3 + .01) * band * u_scan;
  // 暗角
  col *= 1. - .2 * u_curve * r2;
  // 转动后平面边缘以外露出的部分压暗
  vec2 e = abs(cd);
  col *= 1. - smoothstep(.995, 1.005, max(e.x, e.y));

}`;
  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  };
  const v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
  if (!v || !f) return null;
  const prog = gl.createProgram();
  gl.attachShader(prog, v); gl.attachShader(prog, f); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return null; }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const U = (n) => gl.getUniformLocation(prog, n);
  const uT = U('u_t'), uGlow = U('u_glow'), uScan = U('u_scan'), uCurve = U('u_curve'), uDpr = U('u_dpr'), uAsp = U('u_asp'), uTilt = U('u_tilt'), uPar = U('u_par');
  gl.uniform1i(U('u_tex'), 0);
  document.body.appendChild(c);
  const api = {
    on: true,
    resize() { c.width = cv.width; c.height = cv.height; gl.viewport(0, 0, c.width, c.height); },
    set(on) { api.on = on; c.style.display = on ? 'block' : 'none'; cv.style.display = on ? 'none' : 'block'; },
    render(t) {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.uniform1f(uT, t); gl.uniform1f(uGlow, FX.glow); gl.uniform1f(uScan, FX.scan);
      gl.uniform1f(uCurve, FX.curve); gl.uniform1f(uDpr, dpr); gl.uniform1f(uAsp, c.width / c.height);
      const r = PAR_DEG * Math.PI / 180 * cfg.parallax;
      gl.uniform2f(uTilt, PAR.cx * r, PAR.cy * r);
      // 深度场：设计像素换算到 [-1, 1] 的屏幕坐标；纹理坐标的 y 朝上，所以 y 取反
      const f = PAR_FIELD * cfg.parallax * s;
      gl.uniform2f(uPar, PAR.cx * f / (W / 2), -PAR.cy * f / (H / 2));

window.hudFx = params.get('fx') === '0' ? null : createFx();

// ---------- sfx：全部用 WebAudio 现场合成，不依赖音频文件 ----------
// ?sfx= 主音量（0 关闭，默认 .35），?hum=0 关闭底噪；WE 用户属性同名（sfx 滑块、hum 复选框）。
// 浏览器里 AudioContext 需要一次点击 / 按键才能启动；Wallpaper Engine 与 Lively 中可直接播放。
const SFX = { vol: fxNum('sfx', .35), hum: params.get('hum') !== '0' };
const sfx = (() => {
  // offT 不为 null 时处于离线渲染：tone 的起始时间取 offT，而不是实时上下文的当前时间
  let ac = null, master = null, humNode = null, lastLog = 0, offT = null;
  const ensure = () => {
    if (ac) return ac.state === 'running';
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || SFX.vol <= 0) return false;
    ac = new AC();
    master = ac.createGain(); master.gain.value = SFX.vol;
    // 短反馈延迟，给提示音一点空间感
    const delay = ac.createDelay(), fb = ac.createGain(), wet = ac.createGain();
    delay.delayTime.value = .13; fb.gain.value = .3; wet.gain.value = .3;
    master.connect(ac.destination); master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ac.destination);
    ac.resume();
    return ac.state === 'running';
  };
  const tone = (f, d, { type = 'sine', g = .2, to = 0, at = 0 } = {}) => {
    if (offT == null && !ensure()) return;
    const t = (offT ?? ac.currentTime) + at, o = ac.createOscillator(), e = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(g, t + .006); e.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(e); e.connect(master); o.start(t); o.stop(t + d + .05);
  };
  // 底噪：两个微失谐的锯齿波经低通，截止频率随 CPU / GPU 负载升高，负载越高越“亮”
  const startHum = () => {
    if (humNode || !ensure()) return;
    const lp = ac.createBiquadFilter(), g = ac.createGain();
    lp.type = 'lowpass'; lp.Q.value = 4; lp.frequency.value = 140; g.gain.value = 0;
    const os = [55, 55.35, 110.2].map((f, i) => {
      const o = ac.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'sine'; o.frequency.value = f; o.connect(lp); o.start(); return o;
    });
    lp.connect(g); g.connect(master);
    g.gain.setTargetAtTime(.045, ac.currentTime, 2);
    humNode = { lp, g, os };
  };
  const stopHum = () => {
    if (!humNode) return;
    const h = humNode; humNode = null;
    h.g.gain.setTargetAtTime(0, ac.currentTime, .5);
    setTimeout(() => h.os.forEach(o => o.stop()), 2500);
  };
  let booted = false;
  const unlock = () => {
    if (booted || !ensure()) return;
    booted = true;
    if (SFX.hum) startHum();
    boot();
  };
  const boot = () => { tone(180, .7, { type: 'triangle', to: 1440, g: .05 }); tone(1440, .25, { g: .04, at: .62 }); };
  addEventListener('pointerdown', unlock); addEventListener('keydown', unlock);
  setTimeout(unlock, 300);
  const api = {
    boot,
    // 暂停时挂起音频上下文（底噪随之停止），恢复时继续
    suspend(on) { if (ac) on ? ac.suspend() : ac.resume(); },
    // 新日志：短促的高频双响，最多每 1.8s 一次，避免长时间运行时过于频繁
    log(now) {
      if (now - lastLog < 1.8) return;
      lastLog = now;
      const f = 2200 + Math.random() * 600;
      tone(f, .045, { g: .05 }); tone(f * 1.5, .03, { g: .025, at: .05 });
    },
    // 状态切换：回到 NOMINAL 为下行双音，ELEVATED 为上行双音，CRITICAL 为三连方波
    status(level) {
      if (level === 'NOMINAL') { tone(988, .16, { g: .07, to: 740 }); tone(659, .22, { g: .06, at: .14 }); }
      else if (level === 'ELEVATED') { tone(660, .1, { g: .08 }); tone(990, .16, { g: .08, at: .11 }); }
      else for (let i = 0; i < 3; i++) tone(1320, .09, { type: 'square', g: .035, at: i * .16 });
    },
    // 组件载入：短促提示音，音高随载入顺序逐级升高
    stage(i) {
      const f = 880 * Math.pow(2, i / 7);
      tone(f, .06, { g: .045 }); tone(f * 2, .035, { g: .018, at: .03 });
    },
    // 告警：三种告警音高不同；进入为两声短促方波 + 上扬，解除为一声下行
    alert(k, on) {
      const f = (ALERT_DEF[k] && ALERT_DEF[k].f) || 700;
      if (on) { tone(f, .1, { type: 'square', g: .035 }); tone(f, .1, { type: 'square', g: .035, at: .14 }); tone(f * 1.5, .25, { g: .05, at: .28 }); }
      else tone(f * 1.5, .3, { g: .04, to: f });
    },
    // 挂载：信号锁定时的短促上扬双音
    mount() { tone(1560, .05, { g: .04 }); tone(2340, .08, { g: .035, at: .06, to: 3120 }); },
    // 全部载入完成：低频下沉 + 高频提示
    land() {
      tone(72, .9, { g: .22, to: 38 });
      tone(2640, .35, { g: .035, at: .02 });
      tone(1320, .55, { type: 'triangle', g: .03, at: .06 });
    },

      if (!ac) return;

      if (!SFX.hum && humNode) stopHum();

      master.gain.setTargetAtTime(SFX.vol, ac.currentTime, .2);
    },
    // 离线渲染（导出视频用）：按记录的 [方法名, 参数, 秒] 事件和 [秒, 负载] 底噪曲线，用同一套合成器渲染单声道音轨

      const delay = off.createDelay(), fb = off.createGain(), wet = off.createGain();
      delay.delayTime.value = .13; fb.gain.value = .3; wet.gain.value = .3;
      master.connect(off.destination); master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(off.destination);
      if (SFX.hum) {
        const lp = off.createBiquadFilter(), g = off.createGain();
        lp.type = 'lowpass'; lp.Q.value = 4; lp.frequency.value = 140; g.gain.value = 0;
        [55, 55.35, 110.2].forEach((f, i) => { const o = off.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'sine'; o.frequency.value = f; o.connect(lp); o.start(0); });
        lp.connect(g); g.connect(master); g.gain.setTargetAtTime(.045, .3, 2);
        for (const [t, l] of loads) lp.frequency.setTargetAtTime(140 + l * 900, t, .8);
      }
      for (const [name, args, t] of events) { offT = t; api[name](...args); }
      offT = null;
      const buf = await off.startRendering();
      [ac, master, lastLog] = saved;
      return buf.getChannelData(0);
    },
  };
  return api;
})();

// ---------- 控制面板：主题、后处理、音效、帧率上限 ----------

// ---------- 开屏：组件依次载入 ----------
// 每个组件从自己的锚点向外生长（圆形裁剪逐渐扩大）并淡入，组件里的文字随之从乱码解码；每个组件开始载入时响一声提示音。按 R 重播。
// [组件, 开始秒, 持续秒, 锚点 x, 锚点 y, 生长半径（0 表示覆盖全屏）, 出现方式]
// 出现方式：grow = 线条从锚点向外平滑延展；neon = 霓虹灯管式闪烁点亮（只在开屏和信号恢复挂载时出现）
const STAGES = [
  ['core', 0, .7, 960, 540, 320, 'neon'],

const MOUNT = {}, MOUNT_DUR = .8;

  cpu: ['wingA', 'cells', 'spec', 'core'], gpu: ['wingA', 'cells', 'spec', 'core'], mem: ['core', 'mem'],

  net: ['keel', 'horizon'], host: ['core', 'spec'],

let presentPrev = null;

}
// 霓虹点亮：前 65% 在亮 / 暗之间随机跳几次，之后稳定爬升到全亮
function neon(p, seed) {

}

// ---------- 告警：CPU 满载 / GPU 满载 / 内存压力 / 下载激增 / 上传激增 ----------
// 高于 hi 持续 2 秒进入告警，低于 lo 持续 2 秒解除；每种告警有自己的颜色、提示文字、日志与音高
const ALERT_DEF = {
  cpu: { label: 'CPU SATURATED', color: () => C.hot, value: () => D.cpu.u == null ? null : D.cpu.u * 100, hi: 90, lo: 80, log: 'cpu', f: 880, fmt: (v) => `${v.toFixed(0)}% sustained` },
  gpu: { label: 'GPU SATURATED', color: () => C.mark, value: () => D.gpu.u == null ? null : D.gpu.u * 100, hi: 90, lo: 80, log: 'gpu', f: 660, fmt: (v) => `${v.toFixed(0)}% sustained` },
  mem: { label: 'MEMORY PRESSURE', color: () => C.alt, value: () => D.mem.u == null || !D.mem.t ? null : D.mem.u / D.mem.t * 100, hi: 90, lo: 80, log: 'sys', f: 520, fmt: (v) => `${v.toFixed(0)}% of pool` },
  dl: { label: 'DOWNLINK SURGE', color: () => C.cool, value: () => D.net.dn == null ? null : D.net.dn / 1e6, hi: 50, lo: 20, log: 'sys', f: 1040, fmt: (v) => `${v.toFixed(0)} MB/s inbound` },
  cput: { label: 'CPU OVERHEAT', color: () => C.heat, value: () => D.cpu.t, hi: 90, lo: 80, log: 'cpu', f: 1320, fmt: (v) => `${v.toFixed(0)}°C package` },
  gput: { label: 'GPU OVERHEAT', color: () => C.heat, value: () => D.gpu.t, hi: 85, lo: 75, log: 'gpu', f: 1180, fmt: (v) => `${v.toFixed(0)}°C core` },
  disk: { label: 'STORAGE BOTTLENECK', color: () => C.fg, value: () => busiestDisk()?.busy ?? null, hi: 90, lo: 70, log: 'io', f: 440, fmt: (v) => `${busiestDisk().n} ${v.toFixed(0)}% busy` },
  ul: { label: 'UPLINK SURGE', color: () => C.cool, value: () => D.net.up == null ? null : D.net.up / 1e6, hi: 20, lo: 8, log: 'sys', f: 1240, fmt: (v) => `${v.toFixed(1)} MB/s outbound` },
};
// 忙碌率最高的那块盘；都没有忙碌率数据时为 null
const busiestDisk = () => D.disks.filter(d => d.busy != null).sort((a, b) => b.busy - a.busy)[0] || null;
const ALERTS = Object.fromEntries(Object.keys(ALERT_DEF).map(k => [k, { on: false, pend: false, pt: 0, t0: 0 }]));
const activeAlerts = () => Object.keys(ALERTS).filter(k => ALERTS[k].on);

const currentAlert = (now) => { const a = activeAlerts(); return a.length ? a[Math.floor(now / 2.5) % a.length] : null; };
function updateAlerts(now) {
  for (const k of Object.keys(ALERT_DEF)) {
    const a = ALERTS[k], def = ALERT_DEF[k], v = def.value();
    const want = v != null && (a.on ? v >= def.lo : v >= def.hi);
    if (want === a.on) { a.pend = a.on; continue; }
    if (a.pend !== want) { a.pend = want; a.pt = now; continue; }
    if (now - a.pt < 2) continue;
    a.on = want; a.t0 = now;
    sfx.alert(k, want);
    logs[def.log].push(want ? 'warn' : 'ok', want ? `${def.label} · ${def.fmt(v)}` : `${def.label.split(' ')[0]} · recovered`, now);
    logs[def.log].next = now + 4;

}
// 屏幕左右边缘的告警光晕，颜色取最早触发的那一项
function alertGlow(now) {
  const cur = currentAlert(now);
  if (!cur) return;
  const col = ALERT_DEF[cur].color(), a = .07 + .07 * Math.sin(now * 4);
  for (const [x0, x1] of [[EL, EL + 160], [ER, ER - 160]]) {
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, alpha(col, a)); g.addColorStop(1, alpha(col, 0));
    ctx.fillStyle = g; ctx.fillRect(Math.min(x0, x1), ET, 160, EB - ET);

// ---------- 功能巡演（?demo=tour） ----------
// 64 秒一轮：平稳 → CPU 满载 → GPU 满载 → 内存压力 → 下载 / 上传激增 → 传感器掉线 → 恢复，期间曲面与辉光起伏一次；
// 每轮换一套底色主题，结尾快速轮换一遍（开屏只在页面打开时播放一次）
const TOUR_LEN = 64, TOUR_T0 = performance.now() / 1000, TOUR_BASE = { power: DEMO_DATA.power, board: DEMO_DATA.board };
let tourLoop = -1;
function tour() {
  const t = performance.now() / 1000 - TOUR_T0, loop = Math.floor(t / TOUR_LEN), T = t % TOUR_LEN;
  // 每一轮用一套底色主题（第一轮 ember，之后依次换）；结尾 6 秒快速轮换其余主题，最后停在下一轮的主题上。直接切换，不重播动画
  const names = Object.keys(THEMES), n = names.length, j = Math.min(Math.floor((T - 58) / 1.5), 3);
  const ti = T < 58 ? loop % n : j < 3 ? (loop + 1 + j) % n : (loop + 1) % n;
  if (ti !== tourLoop) { tourLoop = ti; applySettings({ theme: names[ti] }, false); }
  const sm = (a, b) => { const x = clamp01((T - a) / (b - a)); return x * x * (3 - 2 * x); };
  const bump = (a, b, c, d) => sm(a, b) * (1 - sm(c, d));
  const wob = (f, k = 0) => (Math.sin(t * f + k) + Math.sin(t * f * 2.3 + k * 1.7)) * .5;
  const cl = (v) => Math.min(1, Math.max(0, v));
  const cpuHi = bump(6, 9, 13, 15), gpuHi = bump(14, 17, 21, 23), memHi = bump(22, 25, 29, 31);
  const dl = bump(30, 31, 34, 35), ul = bump(34, 35, 38, 39), lost = T > 40 && T < 45.5, load = bump(14, 15, 18, 19);
  D.up = 86400 * 3 + 3600 * 7 + t;
  D.cpu.u = cl(.2 + .78 * cpuHi + .05 * wob(1.3));
  D.cpu.cores = D.cpu.cores.map((_, i) => cl(D.cpu.u * (D.cpu.types[i] === 'E' ? .75 : 1.05) + .1 * wob(.9, i)));
  D.cpu.f = 3.3 + 1.6 * cpuHi + .15 * D.cpu.u;
  D.cpu.t = lost ? null : 38 + 54 * cpuHi + 6 * D.cpu.u;
  D.gpu.u = cl(.08 + .9 * gpuHi + .04 * wob(1.7, 3));
  D.gpu.vu = 2.6 + 12.8 * gpuHi; D.gpu.t = lost ? null : 34 + 56 * gpuHi;
  D.gpu.power = lost ? null : 28 + 300 * gpuHi; D.gpu.clock = .3 + 2.3 * gpuHi;
  D.mem.u = D.mem.t * (.36 + .6 * memHi + .02 * wob(.5));
  D.mem.avail = D.mem.t - D.mem.u; D.mem.cache = Math.min(D.mem.avail, 8 - 6 * memHi);
  D.mem.commit = D.mem.u * 1.2 + 2; D.mem.cl = D.mem.t + 9.5; D.mem.comp = .2 + 2.4 * memHi;
  D.net.dn = 3e5 + 1.2e8 * dl + 2e5 * wob(2.1); D.net.up = 5e4 + 4.6e7 * ul + 3e4 * wob(1.9);
  D.disks.forEach((d, i) => {
    d.r = i === 1 ? 4e8 * load : 2e5 * (1 + wob(1.1, i));
    d.w = i === 0 ? 1.4e8 * dl + 1e6 : 1e5;
    d.busy = i === 0 ? 12 + 86 * dl : i === 1 ? 8 + 90 * load : 4 + 2 * wob(.7, i);

  const unplug = T >= 30, pct = unplug ? 92 - 76 * sm(30, 58) : 38 + 54 * sm(2, 28);
  D.power = lost ? null : {
    ...TOUR_BASE.power, cpuW: 42 + 170 * cpuHi, ac: !unplug,
    battery: { percent: Math.round(pct), charging: !unplug && pct < 91.5, remainingMin: unplug ? Math.round(pct * 2.6) : null },
  };
  D.board = lost ? null : TOUR_BASE.board;
  // 视差：传感器恢复后模拟鼠标平滑绕一圈，再回到中心
  const pz = bump(45.5, 47, 55, 56.5);
  if (pz > 0) {
    const a = (T - 45.5) / 11 * TAU;
    PAR.mx = Math.cos(a) * pz; PAR.my = Math.sin(a) * .7 * pz; PAR.last = performance.now() / 1000;
  }

  const fx = bump(48, 52, 56, 60);
  FX.curve = cfg.curve + .7 * fx; FX.glow = cfg.glow + .5 * fx;
}
if (TOUR) setInterval(tour, 100);
// ---------- loop ----------
let last = performance.now(), lastDraw = 0, fps = 60, fpsFrames = 0, fpsT = last;
function update(dt, now) {
  const k = (r) => 1 - Math.exp(-r * dt);
  // 所有读数都允许缺失：缺失时为 null，恢复时直接取新值
  S.cpu = ease(S.cpu, D.cpu.u, k(3));
  for (let i = 0; i < D.cpu.cores.length && i < 64; i++) S.cores[i] += (D.cpu.cores[i] - S.cores[i]) * k(5);
  S.f = ease(S.f, D.cpu.f, k(2)); S.ct = ease(S.ct, D.cpu.t, k(1.5));
  // 大号读数单独用更慢的平滑（时间常数约 1.2s）并只显示整数，避免每秒采样的抖动让数字乱滚
  S.cpuD = ease(S.cpuD, D.cpu.u, k(.8)); S.gpuD = ease(S.gpuD, D.gpu.u, k(.8));
  S.gpu = ease(S.gpu, D.gpu.u, k(3)); S.vu = ease(S.vu, D.gpu.vu, k(2)); S.gt = ease(S.gt, D.gpu.t, k(1.5));
  S.mem = ease(S.mem, D.mem.u, k(2));
  S.mcache = ease(S.mcache, D.mem.cache, k(2)); S.mcommit = ease(S.mcommit, D.mem.commit, k(2));
  S.up = ease(S.up, D.net.up, k(4)); S.dn = ease(S.dn, D.net.dn, k(4));
  let dr = null, dw = null;
  for (const d of D.disks) { if (d.r != null) dr = (dr || 0) + d.r; if (d.w != null) dw = (dw || 0) + d.w; }
  S.dio.length = D.disks.length;
  D.disks.forEach((d, i) => { const o = S.dio[i] || (S.dio[i] = [null, null]); o[0] = ease(o[0], d.r, k(4)); o[1] = ease(o[1], d.w, k(4)); });
  S.dr = ease(S.dr, dr, k(4)); S.dw = ease(S.dw, dw, k(4));
  // 外延射线上粒子的流速随负载 / 吞吐变化
  const io = (b) => Math.min(1, Math.log10(1 + b / 1e5) / 4);
  [S.cpu || 0, S.gpu || 0, io(S.dr || 0), io(S.dw || 0)].forEach((v, i) => { S.flow[i] = (S.flow[i] + dt * (.03 + v * .5)) % 1; });
  S.dio.forEach((o, i) => {
    const v = io((o[0] || 0) + (o[1] || 0));
    S.flowD[i] = ((S.flowD[i] || 0) + dt * (.03 + v * .5)) % 1;
    S.spin[i] = ((S.spin[i] || 0) + dt * (1.2 + v * 24)) % TAU;
  });

  loadAcc += dt;
  if (loadAcc >= 1) {

  }
  // 按时间采样（与帧率无关），30Hz

  while (sampleAcc >= 1 / 30) {

  }
  let m = 2.5e5; for (let i = 0; i < HIST; i++) m = Math.max(m, netDn[i], netUp[i]);
  S.scopeMax += (m * 1.15 - S.scopeMax) * k(2);

  updateAlerts(now);
  detectMounts(now);
  sfx.update(Math.max(S.cpu || 0, S.gpu || 0));
  const it = introTime(now);
  STAGES.forEach(([k, at], i) => { if (it >= at && !INTRO.started.has(k)) { INTRO.started.add(k); sfx.stage(i); } });
  if (!INTRO.landed && it > INTRO_END) { INTRO.landed = true; sfx.land(); }

  for (const [key, base] of [['cpu', 2.4], ['gpu', 2.8], ['sys', 3.4], ['io', 3.1]]) {
    const log = logs[key];
    if (now >= log.next) {
      const [tag, msg] = pick(gens[key])();
      log.push(tag, msg, now);
      sfx.log(now);
      log.next = now + base + Math.random() * 1.8;
    }
  }
}

// ---------- 视差：画面随鼠标位置微微转动，各层有深度差 ----------
// 相机朝鼠标方向绕中心转动：近层（读数）反向平移，远层（背景点阵）同向平移，骨架层不动保持像素对齐；
// 整体透视转角在后处理里做。鼠标 3 秒不动或离开窗口时缓慢回正。强度 cfg.parallax（0 关闭）。
const PAR = { mx: 0, my: 0, last: -1e9, cx: 0, cy: 0, x: 0, y: 0 };
// 强度为 1 时：近层的最大平移、骨架深度场中心与边缘各自的最大平移（设计像素），以及整体最大转角
const PAR_PX = 20, PAR_FIELD = 16, PAR_DEG = 3;
addEventListener('mousemove', (e) => {
  PAR.mx = Math.max(-1, Math.min(1, e.clientX / W * 2 - 1));
  PAR.my = Math.max(-1, Math.min(1, e.clientY / H * 2 - 1));
  PAR.last = performance.now() / 1000;
});
document.documentElement.addEventListener('mouseleave', () => { PAR.last = -1e9; });
// 独立壁纸嵌在桌面图标后面收不到鼠标事件，由宿主轮询光标后调用；nx / ny 为窗口内的归一化坐标（-1..1，可超出）
window.hudPointer = (nx, ny) => {
  PAR.mx = Math.max(-1, Math.min(1, nx)); PAR.my = Math.max(-1, Math.min(1, ny));
  PAR.last = performance.now() / 1000;
};
function parallaxStep(dt, now) {
  const idle = now - PAR.last > 3, k = 1 - Math.exp(-dt * (idle ? 1.2 : 4));
  PAR.cx += ((idle ? 0 : PAR.mx) - PAR.cx) * k;
  PAR.cy += ((idle ? 0 : PAR.my) - PAR.cy) * k;
  if (Math.abs(PAR.cx) < 1e-4 && Math.abs(PAR.cy) < 1e-4) PAR.cx = PAR.cy = 0;
  PAR.x = PAR.cx * PAR_PX * cfg.parallax; PAR.y = PAR.cy * PAR_PX * cfg.parallax;
}
// 当前层相对骨架层的平移；pin 把骨架层上的点换算到当前层坐标，用于跨层的连线
const LAYER = { x: 0, y: 0 };
const pin = (x, y) => [x - LAYER.x, y - LAYER.y];
// 多行文本的主次分层：主读数 / 标题为 0，次要行 Z1，说明与第三行 Z2，日志越旧越靠后。
// 在当前坐标系（可能已沿路径旋转）里按相对深度 z 做视差平移后绘制，z < 0 更靠后
// 组内只做轻微错位，层次感主要来自组与组之间（穹面深度场、近层）
const Z1 = -.12, Z2 = -.25;
function depth(z, fn) {
  if (!z || (!PAR.x && !PAR.y)) { fn(); return; }
  const m = ctx.getTransform(), k = -z * dpr * s, dx = PAR.x * k, dy = PAR.y * k, det = m.a * m.d - m.b * m.c;
  ctx.save(); ctx.translate((m.d * dx - m.c * dy) / det, (m.a * dy - m.b * dx) / det);
  fn();
  ctx.restore();
}
function layer(z, fn) {
  const x = -PAR.x * z, y = -PAR.y * z;
  if (!x && !y) { fn(); return; }
  ctx.save(); ctx.translate(x, y); LAYER.x = x; LAYER.y = y;
  fn();
  ctx.restore(); LAYER.x = LAYER.y = 0;
}

function draw(t, now) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // 窗口尺寸为 0 时（最小化、隐藏）背景层也是 0 尺寸，drawImage 会抛错
  if (bgLayer.width && bgLayer.height) {
    // 背景点阵是远层，和鼠标同向移动；露出的边缘用暗角的边缘色补上
    const bx = PAR.x * .4 * dpr * s, by = PAR.y * .4 * dpr * s;
    if (bx || by) { ctx.fillStyle = C.bg1; ctx.fillRect(0, 0, cv.width, cv.height); }
    ctx.drawImage(bgLayer, bx, by);
  }
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
  ctx.textBaseline = 'middle';
  ctx.lineCap = 'butt'; ctx.lineJoin = 'round';

  alertGlow(now);
  staged('decor', now, decor);
  for (const k of [0, 1]) {
    staged('horizon', now, () => horizon(k, now));
    staged('wingA', now, () => wingA(k, now));
    staged('wingB', now, () => wingB(k));
  }
  if (introTime(now) > INTRO_END) {
    for (const k of [0, 1]) {
      pulse(G.A[k], t, 170, k * .5);
      pulse(G.B[k], t, 170, .25 + k * .5);
      pulse(G.crown[k], t, 110, .6);
    }
    pulse(G.keel, t, 120, .1, 0, .5, true);
    pulse(G.keel, t, 120, .1, .5, 1);
  }
  staged('keel', now, keel);
  staged('core', now, () => core(t, now));
  layer(1, () => staged('spec', now, () => { specBlock(0); specBlock(1); }));
  layer(1, () => staged('cells', now, cells));
  staged('mem', now, memPanel);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  txt(`${fps.toFixed(0)} FPS`, W - 20, H - 18, `11px ${F.mono}`, C.dim, 'right', .6);
}

// 独立壁纸在全屏应用前台或从托盘暂停时调用：停止绘制（画面停在最后一帧）并挂起音频
let paused = false;
window.hudPause = (on) => {
  on = !!on;
  if (on === paused) return;
  paused = on;
  sfx.suspend(on);
  if (!on) { last = performance.now(); requestAnimationFrame(frame); }
};
function frame(ts) {
  if (paused) return;
  requestAnimationFrame(frame);
  if (fpsCap > 0 && ts - lastDraw < 1000 / fpsCap - .5) return;
  lastDraw = ts;
  // rAF 的首帧时间戳可能早于脚本启动时刻，dt 需钳到非负
  const dt = Math.min(.1, Math.max(0, (ts - last) / 1000)); last = ts;
  const now = ts / 1000;
  update(dt, now);
  parallaxStep(dt, now);
  draw(now, now);
  if (window.hudFx && window.hudFx.on) window.hudFx.render(now);
  fpsFrames++;
  if (ts - fpsT >= 1000) { fps = fpsFrames * 1000 / (ts - fpsT); fpsFrames = 0; fpsT = ts; }
}
requestAnimationFrame(frame);
</script>
</body>
